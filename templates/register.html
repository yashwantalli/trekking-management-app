{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card auth-card p-4">
    <h3 class="mb-3 text-center">Create an Account</h3>
    <form method="POST" action="{{ url_for('register') }}">
        <div class="mb-3">
            <label class="form-label">I am registering as</label>
            <select name="role" class="form-select" required>
                <option value="user">Trekker (User)</option>
                <option value="staff">Trek Staff</option>
            </select>
            <div class="form-text">Staff accounts require admin approval before you can log in.</div>
        </div>
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required minlength="4">
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Contact Number</label>
            <input type="text" name="contact" class="form-control">
        </div>
        <button type="submit" class="btn btn-success w-100">Register</button>
    </form>
    <p class="text-center mt-3 mb-0">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
</div>
{% endblock %}
